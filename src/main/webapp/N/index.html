<!DOCTYPE html>
<html ng-app="nexusApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexus CI/CD</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/app.css">

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"></script>

    <script src="js/app.js"></script>
    <script src="js/routes.js"></script>
    <script src="js/services.js"></script>

    <script src="js/controllers/dashboard.controller.js"></script>
    <script src="js/controllers/projects.controller.js"></script>
    <script src="js/controllers/pipelines.controller.js"></script>
    <script src="js/controllers/pipeline-steps.controller.js"></script>
    <script src="js/controllers/builds.controller.js"></script>
    <script src="js/controllers/build-steps.controller.js"></script>

    <script src="js/directives/navbar.directive.js"></script>
</head>
<body>

<div class="layout">

    <aside class="sidebar">

        <div class="sidebar-header">
            <div class="logo-box">
                <i class="fa-solid fa-cubes"></i>
            </div>

            <div>
                <h4>Nexus</h4>
                <small>CI/CD Platform</small>
            </div>
        </div>

        <nav class="sidebar-nav">

            <a href="#!/">
                <i class="fa-solid fa-chart-line"></i>
                Dashboard
            </a>

            <a href="#!/projects">
                <i class="fa-solid fa-folder-tree"></i>
                Projects
            </a>

        </nav>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <div>
                <h3 class="mb-0">Nexus CI/CD</h3>
                <small class="text-muted">
                    Continuous Integration Platform
                </small>
            </div>

            <div class="topbar-right">
                <span class="system-pill">
                    <i class="fa-solid fa-circle"></i>
                    System Online
                </span>
            </div>

        </header>

        <section class="content-wrapper">
            <div ng-view></div>
        </section>

    </main>

</div>

</body>
</html>
