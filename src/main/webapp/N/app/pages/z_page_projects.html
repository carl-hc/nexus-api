<div class="projects-page">

    <!-- HEADER -->

    <div class="page-header">

        <div>

            <div class="eyebrow">
                PROJECT MANAGEMENT
            </div>

            <h1 class="page-title">
                Projects
            </h1>

            <p class="page-subtitle">
                Manage repositories, pipelines and deployment environments
            </p>

        </div>

        <div class="page-actions">

            <div class="search-box">

                <i class="fa fa-search"></i>

                <input type="text"
                       ng-model="filters.search"
                       placeholder="Search projects...">

            </div>

            <button class="btn-refresh"
                    ng-click="reload()">

                <i class="fa fa-rotate-right"></i>

            </button>

            <button class="btn-primary"
                    ng-click="createProject()">

                <i class="fa fa-plus"></i>

                New Project

            </button>

        </div>

    </div>

    <!-- STATS -->

    <div class="stats-grid">

        <div class="stat-card">

            <div class="stat-icon">
                <i class="fa fa-cube"></i>
            </div>

            <div>

                <div class="stat-value">
                    {{data.projects.length}}
                </div>

                <div class="stat-label">
                    Projects
                </div>

            </div>

        </div>

    </div>

    <!-- EMPTY -->

    <div class="empty-state"
         ng-if="data.projects.length === 0">

        <div class="empty-icon">
            <i class="fa fa-cube"></i>
        </div>

        <h3>
            No projects found
        </h3>

        <p>
            Create your first project to start building pipelines.
        </p>

        <button class="btn-primary"
                ng-click="createProject()">

            Create Project

        </button>

    </div>

    <!-- PROJECTS -->

    <div class="projects-grid"
         ng-if="data.projects.length">

        <div class="project-card"
             ng-repeat="project in data.projects | filter:filters.search">

            <div class="project-header">

                <div class="project-avatar">

                    {{project.name.charAt(0)}}

                </div>

                <div class="project-menu">

                    <button class="icon-btn"
                            ng-click="editProject(project)">

                        <i class="fa fa-pen"></i>

                    </button>

                    <button class="icon-btn danger"
                            ng-click="deleteProject(project.id)">

                        <i class="fa fa-trash"></i>

                    </button>

                </div>

            </div>

            <div class="project-name">
                {{project.name}}
            </div>

            <div class="project-id">
                Project #{{project.id}}
            </div>

            <div class="project-description"
                 ng-if="project.description">

                {{project.description}}

            </div>

            <div class="project-footer">

                <button class="btn-open"
                        ng-click="openProject(project.id)">

                    Open Project

                </button>

            </div>

        </div>

    </div>

</div>

<style>

    .projects-page{
        padding:40px;
    }

    /* HEADER */

    .page-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:20px;
        margin-bottom:30px;
    }

    .eyebrow{
        font-size:11px;
        font-weight:700;
        letter-spacing:.14em;
        text-transform:uppercase;
        color:#9ca3af;
    }

    .page-title{
        margin:6px 0;
        font-size:42px;
        font-weight:800;
    }

    .page-subtitle{
        margin:0;
        color:#6b7280;
    }

    .page-actions{
        display:flex;
        gap:12px;
        align-items:center;
    }

    /* SEARCH */

    .search-box{
        width:320px;
        height:52px;
        background:white;
        border-radius:18px;
        padding:0 18px;
        display:flex;
        align-items:center;
        box-shadow:0 10px 24px rgba(15,23,42,.04);
    }

    .search-box i{
        color:#9ca3af;
        margin-right:12px;
    }

    .search-box input{
        border:none;
        outline:none;
        width:100%;
        background:transparent;
    }

    /* BUTTONS */

    .btn-primary{
        border:none;
        background:#111827;
        color:white;
        height:52px;
        padding:0 24px;
        border-radius:16px;
        font-weight:600;
    }

    .btn-refresh{
        width:52px;
        height:52px;
        border:none;
        border-radius:16px;
        background:white;
    }

    /* STATS */

    .stats-grid{
        margin-bottom:30px;
    }

    .stat-card{
        width:260px;
        background:white;
        border-radius:24px;
        padding:24px;
        display:flex;
        gap:18px;
        align-items:center;
    }

    .stat-icon{
        width:60px;
        height:60px;
        border-radius:18px;
        background:#111827;
        color:white;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .stat-value{
        font-size:28px;
        font-weight:800;
    }

    .stat-label{
        color:#6b7280;
    }

    /* EMPTY */

    .empty-state{
        background:white;
        border-radius:28px;
        padding:80px;
        text-align:center;
    }

    .empty-icon{
        width:90px;
        height:90px;
        border-radius:24px;
        background:#111827;
        color:white;
        display:flex;
        align-items:center;
        justify-content:center;
        margin:auto;
        font-size:32px;
    }

    /* GRID */

    .projects-grid{
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
        gap:24px;
    }

    /* CARD */

    .project-card{
        background:white;
        border-radius:28px;
        padding:24px;
        box-shadow:0 10px 30px rgba(15,23,42,.05);
        transition:.25s;
    }

    .project-card:hover{
        transform:translateY(-3px);
    }

    .project-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
    }

    .project-avatar{
        width:64px;
        height:64px;
        border-radius:20px;
        background:#111827;
        color:white;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:22px;
        font-weight:700;
    }

    .project-menu{
        display:flex;
        gap:8px;
    }

    .project-name{
        margin-top:18px;
        font-size:20px;
        font-weight:700;
    }

    .project-id{
        margin-top:6px;
        color:#6b7280;
    }

    .project-description{
        margin-top:18px;
        color:#6b7280;
        line-height:1.5;
    }

    .project-footer{
        margin-top:24px;
    }

    .btn-open{
        width:100%;
        border:none;
        background:#111827;
        color:white;
        height:48px;
        border-radius:14px;
        font-weight:600;
    }

    .icon-btn{
        width:42px;
        height:42px;
        border:none;
        border-radius:12px;
        background:#f3f4f6;
    }

    .icon-btn.danger:hover{
        background:#fee2e2;
        color:#dc2626;
    }

    /* RESPONSIVE */

    @media(max-width:768px){

        .page-header{
            flex-direction:column;
            align-items:stretch;
        }

        .page-actions{
            flex-wrap:wrap;
        }

        .search-box{
            width:100%;
        }

        .page-title{
            font-size:34px;
        }

    }

</style>
