<h2>Pipelines</h2>

<div class="card mb-4">
    <div class="card-body">

        <input type="text"
               class="form-control mb-2"
               ng-model="pipeline.name"
               placeholder="Pipeline name">

        <button class="btn btn-primary"
                ng-click="createPipeline()">
            Create
        </button>

    </div>
</div>

<table class="table table-bordered">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr ng-repeat="pipeline in pipelines">

        <td>{{ pipeline.id }}</td>
        <td>{{ pipeline.name }}</td>

        <td>

            <a class="btn btn-sm btn-secondary"
               href="#!/pipelines/{{ pipeline.id }}/steps">
                Steps
            </a>

            <a class="btn btn-sm btn-info"
               href="#!/pipelines/{{ pipeline.id }}/builds">
                Builds
            </a>

            <button class="btn btn-sm btn-success"
                    ng-click="executePipeline(pipeline.id)">
                Execute
            </button>

            <button class="btn btn-sm btn-danger"
                    ng-click="deletePipeline(pipeline.id)">
                Delete
            </button>

        </td>

    </tr>
    </tbody>
</table>
